<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
  <title th:text="${modo == 'crear' ? 'Crear proveedor' : 'Editar proveedor'}">Proveedor</title>
</head>

<body>

  <th:block layout:fragment="breadcrumb">
    Administración &rsaquo;
    <a th:href="@{/proveedores}" style="color:inherit">Proveedores</a>
    &rsaquo;
    <span th:text="${modo == 'crear' ? 'Nuevo' : 'Editar'}">Nuevo</span>
  </th:block>

  <th:block layout:fragment="content">

    <div class="page-header">
      <div>
        <h1 class="page-title" th:text="${modo == 'crear' ? 'Nuevo proveedor' : 'Editar proveedor'}">
          Proveedor
        </h1>
        <p class="page-subtitle"
           th:text="${modo == 'crear'} ? 'Completa los datos para registrar un proveedor.'
                                       : 'Modifica los campos que necesites actualizar.'">
        </p>
      </div>
    </div>

    <div class="form-card">
      <form th:action="${modo == 'crear'} ? @{/proveedores/crear} : @{'/proveedores/' + ${proveedor.id} + '/editar'}"
            th:object="${proveedor}"
            method="post"
            novalidate>

        <div class="form-grid">

          <!-- ID (solo en edición) -->
          <div class="form-group" th:if="${proveedor.id != null}">
            <label class="form-label">ID</label>
            <input class="form-control" type="text" th:field="*{id}" readonly
                   style="background:var(--bg);color:var(--text-muted);cursor:default"/>
          </div>

          <!-- Nombre -->
          <div class="form-group full">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text"
                   th:field="*{nombre}"
                   placeholder="Ej. Distribuidora Acme S.A."/>
            <div class="form-error" th:if="${#fields.hasErrors('nombre')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{nombre}">Nombre inválido</span>
            </div>
          </div>

          <!-- Contacto -->
          <div class="form-group">
            <label class="form-label" for="contacto">Contacto <span style="color:var(--text-hint);font-weight:400">(opcional)</span></label>
            <input class="form-control" id="contacto" type="text"
                   th:field="*{contacto}"
                   placeholder="Ej. María López"/>
            <div class="form-error" th:if="${#fields.hasErrors('contacto')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{contacto}">Contacto inválido</span>
            </div>
          </div>

          <!-- Email -->
          <div class="form-group">
            <label class="form-label" for="email">Email <span style="color:var(--text-hint);font-weight:400">(opcional)</span></label>
            <input class="form-control" id="email" type="email"
                   th:field="*{email}"
                   placeholder="proveedor@correo.com"/>
            <div class="form-error" th:if="${#fields.hasErrors('email')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{email}">Email inválido</span>
            </div>
          </div>

          <!-- Teléfono -->
          <div class="form-group">
            <label class="form-label" for="telefono">Teléfono <span style="color:var(--text-hint);font-weight:400">(opcional)</span></label>
            <input class="form-control" id="telefono" type="text"
                   th:field="*{telefono}"
                   placeholder="Ej. 555 123 4567"/>
            <div class="form-error" th:if="${#fields.hasErrors('telefono')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{telefono}">Teléfono inválido</span>
            </div>
          </div>

          <!-- Dirección -->
          <div class="form-group full">
            <label class="form-label" for="direccion">Dirección <span style="color:var(--text-hint);font-weight:400">(opcional)</span></label>
            <input class="form-control" id="direccion" type="text"
                   th:field="*{direccion}"
                   placeholder="Calle, número, colonia…"/>
            <div class="form-error" th:if="${#fields.hasErrors('direccion')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{direccion}">Dirección inválida</span>
            </div>
          </div>

          <!-- Activo -->
          <div class="form-group full" style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" id="activo" th:field="*{activo}"
                   style="width:16px;height:16px;accent-color:var(--amber);cursor:pointer"/>
            <label for="activo" style="font-size:13px;font-weight:500;cursor:pointer;margin:0">
              Proveedor activo
            </label>
          </div>

        </div><!-- /form-grid -->

        <div class="form-actions">
          <button type="submit" class="btn-primary">
            <i class="ti ti-device-floppy" aria-hidden="true"></i>
            <span th:text="${modo == 'crear' ? 'Crear proveedor' : 'Guardar cambios'}">Guardar</span>
          </button>
          <a class="btn-secondary" th:href="@{/proveedores}">
            <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver
          </a>
        </div>

      </form>
    </div>

  </th:block>
</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Iniciar sesión — Truman POS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --amber:      #D4A843;
      --amber-dark: #BA8F2E;
      --amber-light:#FDF3DC;
      --bg:         #F5F0E8;
      --surface:    #FFFFFF;
      --border:     #E4DDD0;
      --text:       #1A1A2E;
      --text-muted: #6B7280;
      --danger:     #993C1D;
      --danger-bg:  #FAECE7;
      --radius-md:  8px;
      --radius-lg:  12px;
    }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .login-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 40px 36px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 4px 24px rgba(0,0,0,.06);
    }
    .brand {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 28px;
    }
    .brand-icon {
      width: 36px; height: 36px; border-radius: var(--radius-md);
      background: var(--amber);
      display: flex; align-items: center; justify-content: center;
    }
    .brand-icon i { color: #fff; font-size: 18px; }
    .brand-name  { font-size: 16px; font-weight: 600; letter-spacing: -0.2px; }
    .brand-sub   { font-size: 12px; color: var(--text-muted); }

    h1 { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .subtitle { font-size: 13px; color: var(--text-muted); margin-bottom: 24px; }

    .form-group  { margin-bottom: 16px; }
    .form-label  {
      display: block; margin-bottom: 5px;
      font-size: 12px; font-weight: 600;
      text-transform: uppercase; letter-spacing: .4px;
      color: var(--text-muted);
    }
    .input-wrap  { position: relative; }
    .input-icon  {
      position: absolute; left: 10px; top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted); font-size: 16px; pointer-events: none;
    }
    .form-control {
      width: 100%; padding: 9px 10px 9px 34px;
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      font-size: 13px; color: var(--text);
      font-family: inherit; background: var(--surface); outline: none;
      transition: border-color .12s, box-shadow .12s;
    }
    .form-control:focus {
      border-color: var(--amber);
      box-shadow: 0 0 0 3px rgba(212,168,67,.15);
    }

    .alert-error {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; margin-bottom: 16px;
      background: var(--danger-bg); color: var(--danger);
      border: 1px solid #F0997B; border-radius: var(--radius-md);
      font-size: 13px;
    }
    .alert-error i { font-size: 15px; flex-shrink: 0; }

    .alert-ok {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 12px; margin-bottom: 16px;
      background: #EAF3DE; color: #3B6D11;
      border: 1px solid #C0DD97; border-radius: var(--radius-md);
      font-size: 13px;
    }

    .btn-login {
      width: 100%; padding: 10px;
      background: var(--amber); color: #fff;
      border: none; border-radius: var(--radius-md);
      font-size: 14px; font-weight: 600;
      font-family: inherit; cursor: pointer;
      transition: background .12s; margin-top: 4px;
    }
    .btn-login:hover { background: var(--amber-dark); }

    .login-footer {
      margin-top: 20px; text-align: center;
      font-size: 12px; color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="login-card">

    <!-- Logo -->
    <div class="brand">
      <div class="brand-icon"><i class="ti ti-beer" aria-hidden="true"></i></div>
      <div>
        <div class="brand-name">Truman POS</div>
        <div class="brand-sub">Modelorama</div>
      </div>
    </div>

    <h1>Bienvenido</h1>
    <p class="subtitle">Inicia sesión para continuar</p>

    <!-- Error de credenciales -->
    <div th:if="${param.error}" class="alert-error">
      <i class="ti ti-alert-circle" aria-hidden="true"></i>
      Email o contraseña incorrectos.
    </div>

    <!-- Mensaje de logout -->
    <div th:if="${param.logout}" class="alert-ok">
      <i class="ti ti-circle-check" aria-hidden="true"></i>
      Sesión cerrada correctamente.
    </div>

    <!-- Formulario -->
    <form th:action="@{/login}" method="post">

      <div class="form-group">
        <label class="form-label" for="username">Email</label>
        <div class="input-wrap">
          <i class="ti ti-mail input-icon" aria-hidden="true"></i>
          <input class="form-control" id="username" name="username"
                 type="email" placeholder="tu@email.com"
                 autocomplete="email" autofocus required/>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrap">
          <i class="ti ti-lock input-icon" aria-hidden="true"></i>
          <input class="form-control" id="password" name="password"
                 type="password" placeholder="••••••••"
                 autocomplete="current-password" required/>
        </div>
      </div>

      <button type="submit" class="btn-login">
        Iniciar sesión
      </button>
    </form>

    <div class="login-footer">
      Truman POS &copy; 2025
    </div>
  </div>
</body>
</html>

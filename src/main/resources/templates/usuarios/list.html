<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}" lang="es">
<head><title>Usuarios</title></head>
<body>

<th:block layout:fragment="breadcrumb">
  Administración &rsaquo; <span>Usuarios</span>
</th:block>

<th:block layout:fragment="content">

  <div class="page-header">
    <div>
      <h1 class="page-title">Usuarios</h1>
      <p class="page-subtitle">Gestión de accesos al sistema</p>
    </div>
    <a class="btn-primary" th:href="@{/usuarios/crear}">
      <i class="ti ti-plus" aria-hidden="true"></i> Nuevo usuario
    </a>
  </div>

  <!-- Flash -->
  <div th:if="${ok}" class="flash-ok">
    <i class="ti ti-circle-check" aria-hidden="true"></i>
    <span th:text="${ok}"></span>
  </div>

  <!-- Toolbar -->
  <div class="toolbar">
    <form th:action="@{/usuarios}" method="get" style="display:contents">
      <div class="search-box">
        <i class="ti ti-search" aria-hidden="true"></i>
        <input type="text" name="nombre" placeholder="Buscar por nombre…"
               th:value="${nombre}"/>
      </div>
      <input type="hidden" name="page" value="0"/>
      <input type="hidden" name="size" th:value="${page.size}"/>
      <button type="submit" class="filter-btn">
        <i class="ti ti-search" aria-hidden="true"></i> Buscar
      </button>
    </form>
    <span class="result-count"
          th:text="${page.totalElements} + ' usuario(s)'"></span>
  </div>

  <!-- Tabla -->
  <div class="table-card">
    <table class="data-table">
      <thead>
        <tr>
          <th>Usuario</th>
          <th>Email</th>
          <th>Rol</th>
          <th>Estado</th>
          <th>Creado</th>
          <th style="text-align:right">Acciones</th>
        </tr>
      </thead>
      <tbody>
        <tr th:each="u : ${page.content}">
          <td>
            <div class="cell-primary" th:text="${u.nombre}"></div>
            <div class="cell-secondary" th:text="'#' + ${u.id}"></div>
          </td>
          <td th:text="${u.email}" style="color:var(--text-muted);font-size:13px"></td>
          <td>
            <span th:class="${u.rol.name() == 'ADMIN'} ? 'badge badge-active' : 'tag'"
                  th:text="${u.rol.label}"></span>
          </td>
          <td>
            <span th:class="${u.activo} ? 'badge badge-active' : 'badge badge-inactive'"
                  th:text="${u.activo} ? 'Activo' : 'Inactivo'"></span>
          </td>
          <td>
            <span class="cell-secondary"
                  th:text="${#temporals.format(u.creadoEn,'dd/MM/yyyy')}"></span>
          </td>
          <td>
            <div class="row-actions">
              <a class="action-btn" th:href="@{'/usuarios/' + ${u.id} + '/editar'}"
                 title="Editar">
                <i class="ti ti-edit" aria-hidden="true"></i>
              </a>
              <form th:action="@{'/usuarios/' + ${u.id} + '/toggle'}" method="post"
                    style="display:inline">
                <button type="submit" class="action-btn"
                        th:title="${u.activo} ? 'Desactivar' : 'Activar'">
                  <i th:class="${u.activo} ? 'ti ti-toggle-right' : 'ti ti-toggle-left'"
                     aria-hidden="true"></i>
                </button>
              </form>
            </div>
          </td>
        </tr>

        <tr th:if="${page.content.isEmpty()}">
          <td colspan="6">
            <div class="empty-state">
              <i class="ti ti-users-off" aria-hidden="true"></i>
              <p>No hay usuarios registrados.</p>
            </div>
          </td>
        </tr>
      </tbody>
    </table>

    <!-- Paginación -->
    <div class="pagination-bar" th:if="${page.totalPages > 1}">
      <span class="pag-info"
            th:text="'Mostrando ' + (${page.number} * ${page.size} + 1)
                     + '–' + ${#numbers.formatInteger(T(java.lang.Math).min((${page.number}+1)*${page.size},${page.totalElements}),1)}
                     + ' de ' + ${page.totalElements} + ' usuarios'">
      </span>
      <div class="pag-btns">
        <a class="pag-btn" th:classappend="${page.first}?' disabled'"
           th:href="@{/usuarios(nombre=${nombre},page=${page.number-1},size=${page.size})}">
          <i class="ti ti-chevron-left" style="font-size:13px"></i>
        </a>
        <a class="pag-btn"
           th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
           th:classappend="${i == page.number}?' pag-active'"
           th:text="${i+1}"
           th:href="@{/usuarios(nombre=${nombre},page=${i},size=${page.size})}">1</a>
        <a class="pag-btn" th:classappend="${page.last}?' disabled'"
           th:href="@{/usuarios(nombre=${nombre},page=${page.number+1},size=${page.size})}">
          <i class="ti ti-chevron-right" style="font-size:13px"></i>
        </a>
      </div>
    </div>
  </div>

</th:block>
</body>
</html>

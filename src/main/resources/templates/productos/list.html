<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
  <meta charset="UTF-8">
  <title>Productos</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 24px; }
    table { border-collapse: collapse; width: 100%; margin-top: 12px; }
    th, td { border: 1px solid #ddd; padding: 8px 10px; }
    th { background: #f3f3f3; text-align: left; }
    .toolbar { display: flex; gap: 8px; align-items: center; }
    .pagination { display: flex; gap: 6px; margin-top: 12px; }
    .page-link { padding: 6px 10px; border: 1px solid #ddd; text-decoration: none; color: #333; }
    .page-link.active { background: #333; color: #fff; }
    .badge { padding: 2px 6px; border-radius: 6px; font-size: 12px; }
    .badge.ok { background: #e7f6ed; color: #146c2e; border: 1px solid #c6e8d3; }
    .flash { margin: 8px 0; padding: 8px 10px; background: #effaf3; border: 1px solid #cdebd8; color: #0e5a27; }
    form.inline { display: inline; }
    input[type="text"], select { padding: 6px 8px; }
    button, .btn { padding: 6px 10px; border: 1px solid #ddd; background: #fff; cursor: pointer; }
    .btn.primary { background: #333; color: #fff; border-color: #333; }
    .disabled { pointer-events: none; opacity: .5; }
  </style>
</head>
<body>

<h1>Productos</h1>

<div th:if="${ok}" class="flash" th:text="${ok}"></div>

<div class="toolbar">
  <form th:action="@{/productos}" method="get">
    <input type="text" name="nombre" placeholder="Buscar por nombre" th:value="${nombre}">
    <input type="hidden" name="page" value="0"/>
    <input type="hidden" name="size" th:value="${page.size}"/>
    <button type="submit">Buscar</button>
  </form>

  <a class="btn primary" th:href="@{/productos/crear}">+ Nuevo producto</a>
</div>

<table>
  <thead>
  <tr>
    <!-- Columna con toggle de sort -->
    <th>
      <a th:href="@{/productos(nombre=${nombre}, page=${page.number}, size=${page.size}, sort=${ 'nombre,' + ( (param.sort != null and #strings.equalsIgnoreCase(param.sort, 'nombre,asc')) ? 'desc' : 'asc') })}">Nombre</a>
    </th>
    <th>Precio</th>
    <th>Stock</th>
    <th>Categoría</th>
    <th>Activo</th>
    <th style="width:160px;">Acciones</th>
  </tr>
  </thead>
  <tbody>
  <tr th:each="p : ${page.content}">
    <td th:text="${p.nombre}">Nombre</td>
    <td th:text="${#numbers.formatDecimal(p.precio, 1, 'COMMA', 2, 'POINT')}">0.00</td>
    <td th:text="${p.stock}">0</td>
    <td th:text="${p.categoria}">cat</td>
    <td>
      <span th:class="${p.activo} ? 'badge ok' : 'badge'" th:text="${p.activo} ? 'Sí' : 'No'">Sí</span>
    </td>
    <td>
      <a class="btn" th:href="@{|/productos/${p.id}/editar|}">Editar</a>
      <form class="inline" th:action="@{|/productos/${p.id}/eliminar|}" method="post" onsubmit="return confirm('¿Eliminar este producto?');">
        <button type="submit">Eliminar</button>
      </form>
    </td>
  </tr>
  <tr th:if="${page.content.isEmpty()}">
    <td colspan="6">No hay resultados.</td>
  </tr>
  </tbody>
</table>

<!-- Paginación -->
<div class="pagination" th:if="${page.totalPages > 1}">
  <!-- Prev -->
  <a class="page-link" th:classappend="${page.first} ? ' disabled' : ''" th:href="@{/productos(nombre=${nombre}, page=${page.number-1}, size=${page.size}, sort=${param.sort != null ? param.sort : 'nombre,asc'})}">&laquo; Prev</a>

  <!-- Números -->
  <a class="page-link"
     th:each="i : ${#numbers.sequence(0, page.totalPages-1)}"
     th:classappend="${i == page.number} ? ' active' : ''"
     th:text="${i + 1}"
     th:href="@{/productos(nombre=${nombre}, page=${i}, size=${page.size}, sort=${param.sort != null ? param.sort : 'nombre,asc'})}">1</a>

  <!-- Next -->
  <a class="page-link" th:classappend="${page.last} ? ' disabled' : ''" th:href="@{/productos(nombre=${nombre}, page=${page.number+1}, size=${page.size}, sort=${param.sort != null ? param.sort : 'nombre,asc'})}">Next &raquo;</a>
</div>

</body>
</html>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="es">
<head>
  <title th:text="${modo == 'crear' ? 'Crear producto' : 'Editar producto'}">Producto</title>
</head>

<body>

  <!-- ── Breadcrumb ─────────────────────────────── -->
  <th:block layout:fragment="breadcrumb">
    Inventario &rsaquo;
    <a th:href="@{/productos}" style="color:inherit">Productos</a>
    &rsaquo;
    <span th:text="${modo == 'crear' ? 'Nuevo' : 'Editar'}">Nuevo</span>
  </th:block>

  <!-- ── Contenido principal ───────────────────── -->
  <th:block layout:fragment="content">

    <th:block th:with="activeModule='productos'"></th:block>

    <!-- Cabecera de página -->
    <div class="page-header">
      <div>
        <h1 class="page-title" th:text="${modo == 'crear' ? 'Nuevo producto' : 'Editar producto'}">
          Producto
        </h1>
        <p class="page-subtitle"
           th:text="${modo == 'crear'} ? 'Completa los datos para agregar un producto al catálogo.'
                                       : 'Modifica los campos que necesites actualizar.'">
        </p>
      </div>
    </div>

    <!-- Formulario -->
    <div class="form-card">
      <form th:action="${modo == 'crear'} ? @{/productos/crear} : @{'/productos/' + ${producto.id} + '/editar'}"
            th:object="${producto}"
            method="post"
            novalidate>

        <div class="form-grid">

          <!-- ID (solo en edición) -->
          <div class="form-group" th:if="${producto.id != null}">
            <label class="form-label">ID</label>
            <input class="form-control" type="text" th:field="*{id}" readonly
                   style="background:var(--bg);color:var(--text-muted);cursor:default"/>
          </div>

          <!-- Nombre -->
          <div class="form-group full">
            <label class="form-label" for="nombre">Nombre</label>
            <input class="form-control" id="nombre" type="text"
                   th:field="*{nombre}"
                   placeholder="Ej. Teclado Mecánico"/>
            <div class="form-error" th:if="${#fields.hasErrors('nombre')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{nombre}">Nombre inválido</span>
            </div>
          </div>

          <!-- Precio -->
          <div class="form-group">
            <label class="form-label" for="precio">Precio</label>
            <input class="form-control" id="precio" type="number"
                   step="0.01" min="0"
                   th:field="*{precio}"
                   placeholder="0.00"/>
            <div class="form-error" th:if="${#fields.hasErrors('precio')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{precio}">Precio inválido</span>
            </div>
          </div>

          <!-- Stock -->
          <div class="form-group">
            <label class="form-label" for="stock">Stock</label>
            <input class="form-control" id="stock" type="number"
                   step="1" min="0"
                   th:field="*{stock}"
                   placeholder="0"/>
            <div class="form-error" th:if="${#fields.hasErrors('stock')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{stock}">Stock inválido</span>
            </div>
          </div>

          <!-- Categoría -->
          <div class="form-group full">
            <label class="form-label" for="categoria">Categoría</label>
            <input class="form-control" id="categoria" type="text"
                   th:field="*{categoria}"
                   autocomplete="off"
                   placeholder="Ej. perifericos"/>
            <div class="form-error" th:if="${#fields.hasErrors('categoria')}">
              <i class="ti ti-alert-circle" aria-hidden="true"></i>
              <span th:errors="*{categoria}">Categoría inválida</span>
            </div>
          </div>

          <!-- Activo -->
          <div class="form-group full" style="display:flex;align-items:center;gap:10px">
            <input type="checkbox" id="activo" th:field="*{activo}"
                   style="width:16px;height:16px;accent-color:var(--amber);cursor:pointer"/>
            <label for="activo" style="font-size:13px;font-weight:500;cursor:pointer;margin:0">
              Producto activo
            </label>
          </div>

        </div><!-- /form-grid -->

        <!-- Acciones -->
        <div class="form-actions">
          <button type="submit" class="btn-primary">
            <i class="ti ti-device-floppy" aria-hidden="true"></i>
            <span th:text="${modo == 'crear' ? 'Crear producto' : 'Guardar cambios'}">Guardar</span>
          </button>
          <a class="btn-secondary" th:href="@{/productos}">
            <i class="ti ti-arrow-left" aria-hidden="true"></i> Volver
          </a>
        </div>

      </form>
    </div>

    <script th:inline="javascript">
      const CATEGORIAS = /*[[${categorias}]]*/ [];
      attachAutocomplete(document.getElementById('categoria'), CATEGORIAS);
    </script>

  </th:block>
</body>
</html>

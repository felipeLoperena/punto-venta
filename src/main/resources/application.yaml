spring:
  profiles:
    active: local

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:mysql://localhost:3306/punto_venta
    username: jonhouseman
    password: soothsayer
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
